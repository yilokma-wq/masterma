<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業玄空飛星與八宅排盤系統</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --border-color: #dcd6cd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }
        label { font-weight: bold; }
        select, input, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px; }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #a00000; }

        /* 九宮格視覺順序 (東南, 正南, 西南, 正東, 中宮, 正西, 東北, 正北, 西北) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .cell {
            background: #fff8f0;
            border: 2px solid #b8860b;
            border-radius: 6px;
            aspect-ratio: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cell-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; font-weight: bold; }
        .cell-main { display: flex; justify-content: space-around; align-items: center; font-size: 1.4em; font-weight: bold; margin: 5px 0; }
        
        .star-mountain { color: #1e90ff; } /* 山星 藍色 */
        .star-facing { color: #dc143c; }   /* 向星 紅色 */
        .star-period { color: #2e8b57; }   /* 運星 綠色 */
        .star-annual { color: #ff8c00; }   /* 流年星 橙色 */

        .cell-footer { display: flex; justify-content: space-between; font-size: 0.85em; background: #eee; padding: 2px 4px; border-radius: 3px; }
        .bazhai-tag { font-weight: bold; color: #8b0000; }

        .analysis-card { border-left: 4px solid var(--primary-color); padding: 12px 16px; background: #fff; margin-bottom: 12px; border-radius: 0 4px 4px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .analysis-title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; color: var(--primary-color); }
        .badge { display: inline-block; padding: 2px 6px; font-size: 0.8em; border-radius: 3px; color: white; margin-left: 8px; }
        .badge-ji { background-color: #2e8b57; }
        .badge-xiong { background-color: #dc143c; }
    </style>
</head>
<body>

<div class="container">
    <h1>專業玄空飛星與八宅排盤系統</h1>

    <div class="panel">
        <div class="form-group">
            <label>三元九運：</label>
            <select id="period">
                <option value="1">一運 (1864-1883)</option>
                <option value="2">二運 (1884-1903)</option>
                <option value="3">三運 (1904-1923)</option>
                <option value="4">四運 (1924-1943)</option>
                <option value="5">五運 (1944-1963)</option>
                <option value="6">六運 (1964-1983)</option>
                <option value="7">七運 (1984-2003)</option>
                <option value="8">八運 (2004-2023)</option>
                <option value="9" selected>九運 (2024-2043)</option>
            </select>

            <label>24山坐向：</label>
            <select id="mountainFacing"></select>

            <label>流年（西元）：</label>
            <input type="number" id="annualYear" value="2026" min="1900" max="2100" style="width: 80px;">

            <button onclick="calculate()">即時排盤</button>
        </div>
    </div>

    <div class="panel">
        <div style="text-align:center; margin-bottom:10px; font-weight:bold; color:#666;">
            <span style="color:#1e90ff;">■ 山星</span> | 
            <span style="color:#dc143c;">■ 向星</span> | 
            <span style="color:#2e8b57;">■ 運星</span> | 
            <span style="color:#ff8c00;">■ 流年星</span>
        </div>
        <div class="grid-container" id="grid"></div>
    </div>

    <div class="panel">
        <h2>吉凶組合與化解解法</h2>
        <div id="analysisResult"></div>
    </div>
</div>

<script>
// 宮位定義：固定標準順序 [0:巽/東南, 1:離/正南, 2:坤/西南, 3:震/正東, 4:中宮, 5:兌/正西, 6:艮/東北, 7:坎/正北, 8:乾/西北]
const PALACE_NAMES = ["東南 (巽)", "正南 (離)", "西南 (坤)", "正東 (震)", "中宮", "正西 (兌)", "東北 (艮)", "正北 (坎)", "西北 (乾)"];
const PALACE_GUA = ["巽", "離", "坤", "震", "中", "兌", "艮", "坎", "乾"];

// 洛書順飛路線：中(4) -> 乾(8) -> 兌(5) -> 艮(6) -> 離(1) -> 坎(7) -> 坤(2) -> 震(3) -> 巽(0)
const LUOSHUI_FLY_ORDER = [4, 8, 5, 6, 1, 7, 2, 3, 0];

// 24山配置 (包含所屬宮位、三元龍天天地人、陰陽)
// 陰陽規則：陽(+)順飛，陰(-)逆飛
const MOUNTAINS = [
    { name: "壬山丙向", palace: 7, facingPalace: 1, yinYang: 1 },  // 坎宮 天干壬 (陽)
    { name: "子山午向", palace: 7, facingPalace: 1, yinYang: -1 }, // 坎宮 地支子 (陰)
    { name: "癸山丁向", palace: 7, facingPalace: 1, yinYang: -1 }, // 坎宮 天干癸 (陰)
    { name: "丑山未向", palace: 6, facingPalace: 2, yinYang: -1 }, // 艮宮 地支丑 (陰)
    { name: "艮山坤向", palace: 6, facingPalace: 2, yinYang: 1 },  // 艮宮 卦象艮 (陽)
    { name: "寅山申向", palace: 6, facingPalace: 2, yinYang: 1 },  // 艮宮 地支寅 (陽)
    { name: "甲山庚向", palace: 3, facingPalace: 5, yinYang: 1 },  // 震宮 天干甲 (陽)
    { name: "卯山酉向", palace: 3, facingPalace: 5, yinYang: -1 }, // 震宮 地支卯 (陰)
    { name: "乙山辛向", palace: 3, facingPalace: 5, yinYang: -1 }, // 震宮 天干乙 (陰)
    { name: "辰山戌向", palace: 0, facingPalace: 8, yinYang: -1 }, // 巽宮 地支辰 (陰)
    { name: "巽山乾向", palace: 0, facingPalace: 8, yinYang: 1 },  // 巽宮 卦象巽 (陽)
    { name: "巳山亥向", palace: 0, facingPalace: 8, yinYang: 1 },  // 巽宮 地支巳 (陽)
    { name: "丙山壬向", palace: 1, facingPalace: 7, yinYang: 1 },  // 離宮 天干丙 (陽)
    { name: "午山子向", palace: 1, facingPalace: 7, yinYang: -1 }, // 離宮 地支午 (陰)
    { name: "丁山癸向", palace: 1, facingPalace: 7, yinYang: -1 }, // 離宮 天干丁 (陰)
    { name: "未山丑向", palace: 2, facingPalace: 6, yinYang: -1 }, // 坤宮 地支未 (陰)
    { name: "坤山艮向", palace: 2, facingPalace: 6, yinYang: 1 },  // 坤宮 卦象坤 (陽)
    { name: "申山寅向", palace: 2, facingPalace: 6, yinYang: 1 },  // 坤宮 地支申 (陽)
    { name: "庚山甲向", palace: 5, facingPalace: 3, yinYang: 1 },  // 兌宮 天干庚 (陽)
    { name: "酉山卯向", palace: 5, facingPalace: 3, yinYang: -1 }, // 兌宮 地支酉 (陰)
    { name: "辛山乙向", palace: 5, facingPalace: 3, yinYang: -1 }, // 兌宮 天干辛 (陰)
    { name: "戌山辰向", palace: 8, facingPalace: 0, yinYang: -1 }, // 乾宮 地支戌 (陰)
    { name: "乾山巽向", palace: 8, facingPalace: 0, yinYang: 1 },  // 乾宮 卦象乾 (陽)
    { name: "亥山巳向", palace: 8, facingPalace: 0, yinYang: 1 }   // 乾宮 地支亥 (陽)
];

// 八宅遊年對應表 (按坐山卦象)
const BAZHAI_MAP = {
    "坎": ["生氣", "延年", "絕命", "天醫", "伏位", "禍害", "五鬼", "伏位", "六煞"],
    "離": ["天醫", "伏位", "六煞", "生氣", "伏位", "五鬼", "禍害", "延年", "絕命"],
    "震": ["延年", "生氣", "禍害", "伏位", "伏位", "絕命", "六煞", "天醫", "五鬼"],
    "巽": ["伏位", "天醫", "五鬼", "延年", "伏位", "六煞", "絕命", "生氣", "禍害"],
    "乾": ["禍害", "絕命", "延年", "五鬼", "伏位", "生氣", "天醫", "六煞", "伏位"],
    "坤": ["五鬼", "六煞", "伏位", "禍害", "伏位", "天醫", "生氣", "絕命", "延年"],
    "艮": ["絕命", "禍害", "生氣", "六煞", "伏位", "延年", "伏位", "五鬼", "天醫"],
    "兌": ["六煞", "五鬼", "天醫", "絕命", "伏位", "伏位", "延年", "禍害", "生氣"]
};

// 正確的飛星演算法 (入中宮後按洛書順序分布)
function flyStars(centerStar, isForward) {
    let result = new Array(9);
    for (let step = 0; step < 9; step++) {
        let currentStar;
        if (isForward) {
            currentStar = (centerStar - 1 + step) % 9 + 1;
        } else {
            currentStar = (centerStar - 1 - step) % 9;
            if (currentStar < 0) currentStar += 9;
            currentStar += 1;
        }
        let targetPalace = LUOSHUI_FLY_ORDER[step];
        result[targetPalace] = currentStar;
    }
    return result;
}

// 精確流年紫白星計算公式 (1900-2099)
function getAnnualCenterStar(year) {
    let sum = year.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
    while (sum >= 10) {
        sum = sum.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
    }
    let centerStar = 11 - sum;
    if (centerStar > 9) centerStar -= 9;
    if (centerStar <= 0) centerStar += 9;
    return centerStar;
}

// 初始化選單
function init() {
    const select = document.getElementById("mountainFacing");
    select.innerHTML = "";
    MOUNTAINS.forEach((m, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.innerText = m.name;
        select.appendChild(opt);
    });
    calculate();
}

function calculate() {
    const period = parseInt(document.getElementById("period").value);
    const mIdx = parseInt(document.getElementById("mountainFacing").value);
    const annualYear = parseInt(document.getElementById("annualYear").value);
    const selectedM = MOUNTAINS[mIdx];

    // 1. 運星盤 (順飛)
    const periodStars = flyStars(period, true);

    // 2. 山星盤 (取坐山對應宮位之運星入中)
    const mountainBaseStar = periodStars[selectedM.palace];
    const isMountainForward = selectedM.yinYang >= 0;
    const mountainStars = flyStars(mountainBaseStar, isMountainForward);

    // 3. 向星盤 (取向山對應宮位之運星入中)
    const facingBaseStar = periodStars[selectedM.facingPalace];
    const isFacingForward = selectedM.yinYang < 0; // 坐向陰陽相反
    const facingStars = flyStars(facingBaseStar, isFacingForward);

    // 4. 流年星盤 (流年星入中，一律順飛)
    const annualCenter = getAnnualCenterStar(annualYear);
    const annualStars = flyStars(annualCenter, true);

    // 5. 八宅
    const sitGua = PALACE_GUA[selectedM.palace] === "中" ? "坤" : PALACE_GUA[selectedM.palace];
    const bazhaiList = BAZHAI_MAP[sitGua] || BAZHAI_MAP["乾"];

    // 渲染 UI
    const gridEl = document.getElementById("grid");
    gridEl.innerHTML = "";
    let analysisHTML = "";

    for (let i = 0; i < 9; i++) {
        const mStar = mountainStars[i];
        const fStar = facingStars[i];
        const pStar = periodStars[i];
        const aStar = annualStars[i];
        const bTag = bazhaiList[i];

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `
            <div class="cell-header">
                <span>${PALACE_NAMES[i]}</span>
                <span class="bazhai-tag">${bTag}</span>
            </div>
            <div class="cell-main">
                <span class="star-mountain">${mStar}</span>
                <span class="star-facing">${fStar}</span>
            </div>
            <div class="cell-footer">
                <span>運:${pStar}</span>
                <span class="star-annual">年:${aStar}</span>
            </div>
        `;
        gridEl.appendChild(cell);

        // 分析與斷語邏輯（略，保持吉凶批斷）
        if (fStar === 5 || aStar === 5) {
            analysisHTML += `<div class="analysis-card">
                <div class="analysis-title">${PALACE_NAMES[i]} - 注意五黃廉貞煞</div>
                <p>此方位有五黃凶星（向星 ${fStar} / 流年星 ${aStar}），主意外與病痛。<br>
                <span style="color:#d9534f;">💡 解決方案：</span>宜放六帝錢或銅葫蘆化解，切忌動土。</p>
            </div>`;
        }
    }

    if (!analysisHTML) analysisHTML = "<p>此格局整體氣場平穩，無極端凶煞。</p>";
    document.getElementById("analysisResult").innerHTML = analysisHTML;
}

window.onload = init;
</script>
</body>
</html>
