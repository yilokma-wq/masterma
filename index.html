<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業玄空飛星與八宅排盤系統</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --border-color: #dcd6cd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }
        label { font-weight: bold; }
        select, input, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px; }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #a00000; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .cell {
            background: #fff8f0;
            border: 2px solid #b8860b;
            border-radius: 6px;
            aspect-ratio: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cell-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; font-weight: bold; }
        .cell-main { display: flex; justify-content: space-around; align-items: center; font-size: 1.4em; font-weight: bold; margin: 5px 0; }
        
        .star-mountain { color: #1e90ff; } /* 山星 藍色 */
        .star-facing { color: #dc143c; }   /* 向星 紅色 */
        .star-period { color: #2e8b57; }   /* 運星 綠色 */
        .star-annual { color: #ff8c00; }   /* 流年星 橙色 */

        .cell-footer { display: flex; justify-content: space-between; font-size: 0.85em; background: #eee; padding: 2px 4px; border-radius: 3px; }
        .bazhai-tag { font-weight: bold; color: #8b0000; }

        .analysis-card { border-left: 4px solid var(--primary-color); padding: 12px 16px; background: #fff; margin-bottom: 12px; border-radius: 0 4px 4px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .analysis-title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>專業玄空飛星與八宅排盤系統</h1>

    <div class="panel">
        <div class="form-group">
            <label>三元九運：</label>
            <select id="period">
                <option value="1">一運 (1864-1883)</option>
                <option value="2">二運 (1884-1903)</option>
                <option value="3">三運 (1904-1923)</option>
                <option value="4">四運 (1924-1943)</option>
                <option value="5">五運 (1944-1963)</option>
                <option value="6">六運 (1964-1983)</option>
                <option value="7">七運 (1984-2003)</option>
                <option value="8" selected>八運 (2004-2023)</option>
                <option value="9">九運 (2024-2043)</option>
            </select>

            <label>24山坐向：</label>
            <select id="mountainFacing"></select>

            <label>流年（西元）：</label>
            <input type="number" id="annualYear" value="2026" min="1900" max="2100" style="width: 80px;">

            <button onclick="calculate()">即時排盤</button>
        </div>
    </div>

    <div class="panel">
        <div style="text-align:center; margin-bottom:10px; font-weight:bold; color:#666;">
            <span style="color:#1e90ff;">■ 山星</span> | 
            <span style="color:#dc143c;">■ 向星</span> | 
            <span style="color:#2e8b57;">■ 運星</span> | 
            <span style="color:#ff8c00;">■ 流年星</span>
        </div>
        <div class="grid-container" id="grid"></div>
    </div>

    <div class="panel">
        <h2>吉凶組合與化解解法</h2>
        <div id="analysisResult"></div>
    </div>
</div>

<script>
// 宮位顯示順序 (0:東南, 1:正南, 2:西南, 3:正東, 4:中宮, 5:正西, 6:東北, 7:正北, 8:西北)
const PALACE_NAMES = ["東南 (巽)", "正南 (離)", "西南 (坤)", "正東 (震)", "中宮", "正西 (兌)", "東北 (艮)", "正北 (坎)", "西北 (乾)"];

// 洛書九宮順飛順序對應到網格索引：中(4) -> 乾(8) -> 兌(5) -> 艮(6) -> 離(1) -> 坎(7) -> 坤(2) -> 震(3) -> 巽(0)
const LUOSHUI_PATH = [4, 8, 5, 6, 1, 7, 2, 3, 0];

// 三元龍陰陽屬性 (1:陽順飛, -1:陰逆飛) [地元龍, 天元龍, 人元龍]
const DRAGON_YIN_YANG = {
    1: [ 1, -1, -1], // 壬(陽) 子(陰) 癸(陰)
    2: [-1,  1,  1], // 丑(陰) 艮(陽) 寅(陽)
    3: [ 1, -1, -1], // 甲(陽) 卯(陰) 乙(陰)
    4: [-1,  1,  1], // 辰(陰) 巽(陽) 巳(陽)
    5: [ 1,  1,  1], // 五黃寄坤二宮 (丑陰,艮陽,寅陽 / 未陰,坤陽,申陽)
    6: [ 1,  1, -1], // 戌(陽) 乾(陽) 亥(陰)
    7: [ 1, -1, -1], // 庚(陽) 酉(陰) 辛(陰)
    8: [-1,  1,  1], // 未(陰) 坤(陽) 申(陽)
    9: [ 1, -1, -1]  // 丙(陽) 午(陰) 丁(陰)
};

// 24山對應宮位與龍別 (0:地元龍, 1:天元龍, 2:人元龍)
const MOUNTAINS = [
    { name: "壬山丙向", palace: 7, facingPalace: 1, dragonType: 0 },
    { name: "子山午向", palace: 7, facingPalace: 1, dragonType: 1 },
    { name: "癸山丁向", palace: 7, facingPalace: 1, dragonType: 2 },
    { name: "丑山未向", palace: 6, facingPalace: 2, dragonType: 0 },
    { name: "艮山坤向", palace: 6, facingPalace: 2, dragonType: 1 },
    { name: "寅山申向", palace: 6, facingPalace: 2, dragonType: 2 },
    { name: "甲山庚向", palace: 3, facingPalace: 5, dragonType: 0 },
    { name: "卯山酉向", palace: 3, facingPalace: 5, dragonType: 1 },
    { name: "乙山辛向", palace: 3, facingPalace: 5, dragonType: 2 },
    { name: "辰山戌向", palace: 0, facingPalace: 8, dragonType: 0 },
    { name: "巽山乾向", palace: 0, facingPalace: 8, dragonType: 1 },
    { name: "巳山亥向", palace: 0, facingPalace: 8, dragonType: 2 },
    { name: "丙山壬向", palace: 1, facingPalace: 7, dragonType: 0 },
    { name: "午山子向", palace: 1, facingPalace: 7, dragonType: 1 },
    { name: "丁山癸向", palace: 1, facingPalace: 7, dragonType: 2 },
    { name: "未山丑向", palace: 2, facingPalace: 6, dragonType: 0 },
    { name: "坤山艮向", palace: 2, facingPalace: 6, dragonType: 1 },
    { name: "申山寅向", palace: 2, facingPalace: 6, dragonType: 2 },
    { name: "庚山甲向", palace: 5, facingPalace: 3, dragonType: 0 },
    { name: "酉山卯向", palace: 5, facingPalace: 3, dragonType: 1 },
    { name: "辛山乙向", palace: 5, facingPalace: 3, dragonType: 2 },
    { name: "戌山辰向", palace: 8, facingPalace: 0, dragonType: 0 },
    { name: "乾山巽向", palace: 8, facingPalace: 0, dragonType: 1 },
    { name: "亥山巳向", palace: 8, facingPalace: 0, dragonType: 2 }
];

// 八宅遊年 (中宮 4 保持空白 "")
const BAZHAI_MAP = {
    7: ["生氣", "延年", "絕命", "天醫", "", "禍害", "五鬼", "伏位", "六煞"], // 坎宅
    1: ["天醫", "伏位", "六煞", "生氣", "", "五鬼", "禍害", "延年", "絕命"], // 離宅
    3: ["延年", "生氣", "禍害", "伏位", "", "絕命", "六煞", "天醫", "五鬼"], // 震宅
    0: ["伏位", "天醫", "五鬼", "延年", "", "六煞", "絕命", "生氣", "禍害"], // 巽宅
    8: ["禍害", "絕命", "延年", "五鬼", "", "生氣", "天醫", "六煞", "伏位"], // 乾宅
    2: ["五鬼", "六煞", "伏位", "禍害", "", "天醫", "生氣", "絕命", "延年"], // 坤宅
    6: ["絕命", "禍害", "生氣", "六煞", "", "延年", "伏位", "五鬼", "天醫"], // 艮宅
    5: ["六煞", "五鬼", "天醫", "絕命", "", "伏位", "延年", "禍害", "生氣"]  // 兌宅
};

// 飛星算法 (入中星 + 順逆方向)
function flyStars(centerStar, isForward) {
    let result = new Array(9);
    for (let step = 0; step < 9; step++) {
        let star;
        if (isForward) {
            star = (centerStar - 1 + step) % 9 + 1;
        } else {
            star = (centerStar - 1 - step) % 9;
            if (star <= 0) star += 9;
        }
        let gridIdx = LUOSHUI_PATH[step];
        result[gridIdx] = star;
    }
    return result;
}

// 三元龍陰陽判定
function getYinYang(star, dragonType) {
    let targetStar = star;
    if (targetStar === 5) targetStar = 2; // 五黃寄坤宮
    return DRAGON_YIN_YANG[targetStar][dragonType];
}

// 計算流年星入中
function getAnnualCenterStar(year) {
    let rem = year % 9;
    let star = (11 - rem) % 9;
    if (star === 0) star = 9;
    return star;
}

function init() {
    const select = document.getElementById("mountainFacing");
    select.innerHTML = "";
    MOUNTAINS.forEach((m, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.innerText = m.name;
        select.appendChild(opt);
    });
    calculate();
}

function calculate() {
    const period = parseInt(document.getElementById("period").value);
    const mIdx = parseInt(document.getElementById("mountainFacing").value);
    const annualYear = parseInt(document.getElementById("annualYear").value);
    const selectedM = MOUNTAINS[mIdx];

    // 1. 運盤 (運數入中宮順飛)
    const periodStars = flyStars(period, true);

    // 2. 山星盤 (取坐山宮位之運星入中)
    const mountainBaseStar = periodStars[selectedM.palace];
    const isMountainForward = getYinYang(mountainBaseStar, selectedM.dragonType) === 1;
    const mountainStars = flyStars(mountainBaseStar, isMountainForward);

    // 3. 向星盤 (取向首宮位之運星入中)
    const facingBaseStar = periodStars[selectedM.facingPalace];
    const isFacingForward = getYinYang(facingBaseStar, selectedM.dragonType) === 1;
    const facingStars = flyStars(facingBaseStar, isFacingForward);

    // 4. 流年星盤
    const annualCenter = getAnnualCenterStar(annualYear);
    const annualStars = flyStars(annualCenter, true);

    // 5. 八宅遊年
    const bazhaiList = BAZHAI_MAP[selectedM.palace];

    // 渲染 UI
    const gridEl = document.getElementById("grid");
    gridEl.innerHTML = "";
    let analysisHTML = "";

    for (let i = 0; i < 9; i++) {
        const mStar = mountainStars[i];
        const fStar = facingStars[i];
        const pStar = periodStars[i];
        const aStar = annualStars[i];
        const bTag = bazhaiList[i];

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `
            <div class="cell-header">
                <span>${PALACE_NAMES[i]}</span>
                <span class="bazhai-tag">${bTag}</span>
            </div>
            <div class="cell-main">
                <span class="star-mountain">${mStar}</span>
                <span class="star-facing">${fStar}</span>
            </div>
            <div class="cell-footer">
                <span>運:${pStar}</span>
                <span class="star-annual">年:${aStar}</span>
            </div>
        `;
        gridEl.appendChild(cell);

        if (fStar === 5 || aStar === 5) {
            analysisHTML += `<div class="analysis-card">
                <div class="analysis-title">${PALACE_NAMES[i]} - 五黃廉貞土煞</div>
                <p>五黃主疾病凶災。<br>
                <span style="color:#d9534f;">💡 化解方法：</span>此方宜靜不宜動，嚴禁動土。可擺放六帝錢或純銅葫蘆洩去土煞氣。</p>
            </div>`;
        }
    }

    if (!analysisHTML) {
        analysisHTML = "<p>此格局整體氣場平穩，無極端凶煞。</p>";
    }

    document.getElementById("analysisResult").innerHTML = analysisHTML;
}

window.onload = init;
</script>
</body>
</html>
