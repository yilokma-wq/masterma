<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業玄空飛星與八宅排盤系統</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --border-color: #dcd6cd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }
        label { font-weight: bold; }
        select, input, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px; }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #a00000; }

        /* 九宮格視覺順序 (東南, 正南, 西南, 正東, 中宮, 正西, 東北, 正北, 西北) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .cell {
            background: #fff8f0;
            border: 2px solid #b8860b;
            border-radius: 6px;
            aspect-ratio: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cell-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; font-weight: bold; }
        .cell-main { display: flex; justify-content: space-around; align-items: center; font-size: 1.4em; font-weight: bold; margin: 5px 0; }
        
        .star-mountain { color: #1e90ff; } /* 山星 藍色 */
        .star-facing { color: #dc143c; }   /* 向星 紅色 */
        .star-period { color: #2e8b57; }   /* 運星 綠色 */
        .star-annual { color: #ff8c00; }   /* 流年星 橙色 */

        .cell-footer { display: flex; justify-content: space-between; font-size: 0.85em; background: #eee; padding: 2px 4px; border-radius: 3px; }
        .bazhai-tag { font-weight: bold; color: #8b0000; }

        .analysis-card { border-left: 4px solid var(--primary-color); padding: 12px 16px; background: #fff; margin-bottom: 12px; border-radius: 0 4px 4px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .analysis-title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; color: var(--primary-color); }
        .badge { display: inline-block; padding: 2px 6px; font-size: 0.8em; border-radius: 3px; color: white; margin-left: 8px; }
        .badge-ji { background-color: #2e8b57; }
        .badge-xiong { background-color: #dc143c; }
    </style>
</head>
<body>

<div class="container">
    <h1>專業玄空飛星與八宅排盤系統</h1>

    <div class="panel">
        <div class="form-group">
            <label>三元九運：</label>
            <select id="period">
                <option value="1">一運 (1864-1883)</option>
                <option value="2">二運 (1884-1903)</option>
                <option value="3">三運 (1904-1923)</option>
                <option value="4">四運 (1924-1943)</option>
                <option value="5">五運 (1944-1963)</option>
                <option value="6">六運 (1964-1983)</option>
                <option value="7">七運 (1984-2003)</option>
                <option value="8" selected>八運 (2004-2023)</option>
                <option value="9">九運 (2024-2043)</option>
            </select>

            <label>24山坐向：</label>
            <select id="mountainFacing"></select>

            <label>流年（西元）：</label>
            <input type="number" id="annualYear" value="2026" min="1900" max="2100" style="width: 80px;">

            <button onclick="calculate()">即時排盤</button>
        </div>
    </div>

    <div class="panel">
        <div style="text-align:center; margin-bottom:10px; font-weight:bold; color:#666;">
            <span style="color:#1e90ff;">■ 山星</span> | 
            <span style="color:#dc143c;">■ 向星</span> | 
            <span style="color:#2e8b57;">■ 運星</span> | 
            <span style="color:#ff8c00;">■ 流年星</span>
        </div>
        <div class="grid-container" id="grid"></div>
    </div>

    <div class="panel">
        <h2>吉凶組合與化解解法</h2>
        <div id="analysisResult"></div>
    </div>
</div>

<script>
// 宮位固定顯示順序：[0:東南, 1:正南, 2:西南, 3:正東, 4:中宮, 5:正西, 6:東北, 7:正北, 8:西北]
const PALACE_NAMES = ["東南 (巽)", "正南 (離)", "西南 (坤)", "正東 (震)", "中宮", "正西 (兌)", "東北 (艮)", "正北 (坎)", "西北 (乾)"];

// 洛書九宮軌跡對應 UI 陣列索引 (中5, 乾6, 兌7, 艮8, 離9, 坎1, 坤2, 震3, 巽4)
const LUOSHUI_TO_GRID = [4, 8, 5, 6, 1, 7, 2, 3, 0];

// 24山坐向資料 (palace 代表坐山宮位索引，facingPalace 代表向首宮位索引)
const MOUNTAINS = [
    { name: "壬山丙向", palace: 7, facingPalace: 1, yinYang: 1 },  // 坎宮
    { name: "子山午向", palace: 7, facingPalace: 1, yinYang: -1 },
    { name: "癸山丁向", palace: 7, facingPalace: 1, yinYang: -1 },
    { name: "丑山未向", palace: 6, facingPalace: 2, yinYang: -1 }, // 艮宮
    { name: "艮山坤向", palace: 6, facingPalace: 2, yinYang: 1 },
    { name: "寅山申向", palace: 6, facingPalace: 2, yinYang: 1 },
    { name: "甲山庚向", palace: 3, facingPalace: 5, yinYang: 1 },  // 震宮
    { name: "卯山酉向", palace: 3, facingPalace: 5, yinYang: -1 },
    { name: "乙山辛向", palace: 3, facingPalace: 5, yinYang: -1 },
    { name: "辰山戌向", palace: 0, facingPalace: 8, yinYang: -1 }, // 巽宮
    { name: "巽山乾向", palace: 0, facingPalace: 8, yinYang: 1 },
    { name: "巳山亥向", palace: 0, facingPalace: 8, yinYang: 1 },
    { name: "丙山壬向", palace: 1, facingPalace: 7, yinYang: 1 },  // 離宮
    { name: "午山子向", palace: 1, facingPalace: 7, yinYang: -1 },
    { name: "丁山癸向", palace: 1, facingPalace: 7, yinYang: -1 },
    { name: "未山丑向", palace: 2, facingPalace: 6, yinYang: -1 }, // 坤宮
    { name: "坤山艮向", palace: 2, facingPalace: 6, yinYang: 1 },
    { name: "申山寅向", palace: 2, facingPalace: 6, yinYang: 1 },
    { name: "庚山甲向", palace: 5, facingPalace: 3, yinYang: 1 },  // 兌宮
    { name: "酉山卯向", palace: 5, facingPalace: 3, yinYang: -1 },
    { name: "辛山乙向", palace: 5, facingPalace: 3, yinYang: -1 },
    { name: "戌山辰向", palace: 8, facingPalace: 0, yinYang: -1 }, // 乾宮
    { name: "乾山巽向", palace: 8, facingPalace: 0, yinYang: 1 },
    { name: "亥山巳向", palace: 8, facingPalace: 0, yinYang: 1 }
];

// 八宅遊年對應 (索引 0:東南, 1:正南, 2:西南, 3:正東, 4:中宮(空), 5:正西, 6:東北, 7:正北, 8:西北)
const BAZHAI_MAP = {
    7: ["生氣", "延年", "絕命", "天醫", "", "禍害", "五鬼", "伏位", "六煞"], // 坎宅 (壬子癸) -> 正北(7)為伏位
    1: ["天醫", "伏位", "六煞", "生氣", "", "五鬼", "禍害", "延年", "絕命"], // 離宅 (丙午丁)
    3: ["延年", "生氣", "禍害", "伏位", "", "絕命", "六煞", "天醫", "五鬼"], // 震宅 (甲卯乙)
    0: ["伏位", "天醫", "五鬼", "延年", "", "六煞", "絕命", "生氣", "禍害"], // 巽宅 (辰巽巳)
    8: ["禍害", "絕命", "延年", "五鬼", "", "生氣", "天醫", "六煞", "伏位"], // 乾宅 (戌乾亥)
    2: ["五鬼", "六煞", "伏位", "禍害", "", "天醫", "生氣", "絕命", "延年"], // 坤宅 (未坤申)
    6: ["絕命", "禍害", "生氣", "六煞", "", "延年", "伏位", "五鬼", "天醫"], // 艮宅 (丑艮寅)
    5: ["六煞", "五鬼", "天醫", "絕命", "", "伏位", "延年", "禍害", "生氣"]  // 兌宅 (庚酉辛)
};

// 飛星計算函數 (傳入入中星與順逆)
function flyStars(centerStar, isForward) {
    let result = new Array(9);
    for (let step = 0; step < 9; step++) {
        let star;
        if (isForward) {
            star = (centerStar - 1 + step) % 9 + 1;
        } else {
            star = (centerStar - 1 - step) % 9;
            if (star <= 0) star += 9;
        }
        let gridIndex = LUOSHUI_TO_GRID[step];
        result[gridIndex] = star;
    }
    return result;
}

// 嚴格流年紫白星演算法
function getAnnualCenterStar(year) {
    // 玄空紫白飛星入中公式：(11 - (year % 9)) % 9
    let rem = year % 9;
    let star = (11 - rem) % 9;
    if (star === 0) star = 9;
    return star;
}

function init() {
    const select = document.getElementById("mountainFacing");
    select.innerHTML = "";
    MOUNTAINS.forEach((m, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.innerText = m.name;
        select.appendChild(opt);
    });
    calculate();
}

function calculate() {
    const period = parseInt(document.getElementById("period").value);
    const mIdx = parseInt(document.getElementById("mountainFacing").value);
    const annualYear = parseInt(document.getElementById("annualYear").value);
    const selectedM = MOUNTAINS[mIdx];

    // 1. 運星盤 (以運數入中，順飛)
    const periodStars = flyStars(period, true);

    // 2. 山星盤 (取坐山所在宮位的運星入中)
    const mountainBaseStar = periodStars[selectedM.palace];
    const isMountainForward = selectedM.yinYang >= 0;
    const mountainStars = flyStars(mountainBaseStar, isMountainForward);

    // 3. 向星盤 (取向首所在宮位的運星入中)
    const facingBaseStar = periodStars[selectedM.facingPalace];
    const isFacingForward = selectedM.yinYang < 0; // 坐向陰陽相對
    const facingStars = flyStars(facingBaseStar, isFacingForward);

    // 4. 流年星盤 (流年入中，順飛)
    const annualCenter = getAnnualCenterStar(annualYear);
    const annualStars = flyStars(annualCenter, true);

    // 5. 八宅遊年 (取坐山宮位)
    const bazhaiList = BAZHAI_MAP[selectedM.palace];

    // 渲染 UI
    const gridEl = document.getElementById("grid");
    gridEl.innerHTML = "";
    let analysisHTML = "";

    for (let i = 0; i < 9; i++) {
        const mStar = mountainStars[i];
        const fStar = facingStars[i];
        const pStar = periodStars[i];
        const aStar = annualStars[i];
        const bTag = bazhaiList[i];

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `
            <div class="cell-header">
                <span>${PALACE_NAMES[i]}</span>
                <span class="bazhai-tag">${bTag}</span>
            </div>
            <div class="cell-main">
                <span class="star-mountain">${mStar}</span>
                <span class="star-facing">${fStar}</span>
            </div>
            <div class="cell-footer">
                <span>運:${pStar}</span>
                <span class="star-annual">年:${aStar}</span>
            </div>
        `;
        gridEl.appendChild(cell);

        // 簡化批斷與化解提示
        if (fStar === 5 || aStar === 5) {
            analysisHTML += `<div class="analysis-card">
                <div class="analysis-title">${PALACE_NAMES[i]} - 五黃廉貞土煞 (向星:${fStar} / 流年:${aStar})</div>
                <p>五黃主疾病、凶災與破財。<br>
                <span style="color:#d9534f;">💡 化解方法：</span>此方宜靜不宜動，嚴禁動土鑽牆。可擺放六帝錢或純銅葫蘆洩去土煞氣。</p>
            </div>`;
        }
    }

    if (!analysisHTML) {
        analysisHTML = "<p>此格局各宮位星耀組合平穩，無特殊極凶之煞氣。</p>";
    }

    document.getElementById("analysisResult").innerHTML = analysisHTML;
}

window.onload = init;
</script>
</body>
</html>
